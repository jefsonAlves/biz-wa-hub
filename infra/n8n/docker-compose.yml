name: biz-wa-hub-automation

x-n8n-environment: &n8n-environment
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: ${DB_POSTGRESDB_HOST:-postgres}
  DB_POSTGRESDB_PORT: ${DB_POSTGRESDB_PORT:-5432}
  DB_POSTGRESDB_DATABASE: ${DB_POSTGRESDB_DATABASE:-n8n}
  DB_POSTGRESDB_USER: ${DB_POSTGRESDB_USER:-n8n}
  DB_POSTGRESDB_PASSWORD: ${DB_POSTGRESDB_PASSWORD:?DB_POSTGRESDB_PASSWORD is required}
  DB_POSTGRESDB_SCHEMA: ${DB_POSTGRESDB_SCHEMA:-n8n}
  EXECUTIONS_MODE: queue
  QUEUE_BULL_REDIS_HOST: ${QUEUE_BULL_REDIS_HOST:-redis}
  QUEUE_BULL_REDIS_PORT: ${QUEUE_BULL_REDIS_PORT:-6379}
  QUEUE_BULL_REDIS_DB: ${QUEUE_BULL_REDIS_DB:-0}
  QUEUE_HEALTH_CHECK_ACTIVE: "true"
  OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
  N8N_HOST: ${N8N_HOST:-localhost}
  N8N_PORT: 5678
  N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
  N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-http://localhost:5678}
  WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY is required}
  N8N_USER_MANAGEMENT_JWT_SECRET: ${N8N_USER_MANAGEMENT_JWT_SECRET:?N8N_USER_MANAGEMENT_JWT_SECRET is required}
  N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:?N8N_WEBHOOK_SECRET is required}
  N8N_API_KEY: ${N8N_API_KEY:-}
  N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_PERSONALIZATION_ENABLED: "false"
  N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
  N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
  N8N_PAYLOAD_SIZE_MAX: ${N8N_PAYLOAD_SIZE_MAX:-16}
  N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
  NODE_FUNCTION_ALLOW_BUILTIN: crypto
  N8N_METRICS: "true"
  N8N_METRICS_INCLUDE_QUEUE_METRICS: "true"
  EXECUTIONS_DATA_PRUNE: "true"
  EXECUTIONS_DATA_MAX_AGE: ${EXECUTIONS_DATA_MAX_AGE:-336}
  GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/Sao_Paulo}
  TZ: ${TZ:-America/Sao_Paulo}
  SUPABASE_URL: ${SUPABASE_URL:-}
  SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
  OLLAMA_DEFAULT_MODEL: ${OLLAMA_DEFAULT_MODEL:-llama3.2:3b}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_DEFAULT_MODEL: ${OPENAI_DEFAULT_MODEL:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_DEFAULT_MODEL: ${GEMINI_DEFAULT_MODEL:-}
  AI_ROUTER_CONFIDENCE_THRESHOLD: ${AI_ROUTER_CONFIDENCE_THRESHOLD:-0.70}
  AI_ROUTER_COMPLEXITY_THRESHOLD: ${AI_ROUTER_COMPLEXITY_THRESHOLD:-0.65}

x-n8n-service: &n8n-service
  image: ${N8N_IMAGE:-docker.n8n.io/n8nio/n8n:2.31.7}
  restart: unless-stopped
  environment: *n8n-environment
  volumes:
    - n8n_data:/home/node/.n8n
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    ollama:
      condition: service_healthy
  networks:
    - backend
    - outbound
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_POSTGRESDB_DATABASE:-n8n}
      POSTGRES_USER: ${DB_POSTGRESDB_USER:-n8n}
      POSTGRES_PASSWORD: ${DB_POSTGRESDB_PASSWORD:?DB_POSTGRESDB_PASSWORD is required}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_POSTGRESDB_USER:-n8n} -d ${DB_POSTGRESDB_DATABASE:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  ollama:
    image: ollama/ollama:0.32.3
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 20s
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  n8n:
    <<: *n8n-service
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5678/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 45s

  n8n-worker:
    <<: *n8n-service
    command: ["worker", "--concurrency=${N8N_WORKER_CONCURRENCY:-5}"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5678/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 45s

volumes:
  postgres_data:
  redis_data:
  n8n_data:
  ollama_data:

networks:
  backend:
    internal: true
  outbound:
    driver: bridge
